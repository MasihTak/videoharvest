name: Qodana
# Qodana is a merge gate, not a fast feedback loop. Running it on pushes to develop as
# well only scanned the same commits twice against a metered Cloud quota — pnpm lint and
# vitest already cover the push path. Use workflow_dispatch for an off-cycle scan.
on:
  workflow_dispatch:
  pull_request:

# Qodana Cloud usage is metered — never leave a stale scan running once it is superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
